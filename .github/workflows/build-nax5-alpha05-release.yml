name: Build RCP Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - rcp-stream-quality
  pull_request:
    branches:
      - nax5-build16-base

permissions:
  contents: read

concurrency:
  group: rcp-windows-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Disable autocrlf
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: git make unzip zip
          pacboy: >-
            cc:p
            cmake:p
            curl:p
            fast_float:p
            json-c:p
            libevent:p
            lcms2:p
            libdovi:p
            meson:p
            miniupnpc:p
            gcc:p
            nasm:p
            ninja:p
            openssl:p
            opus:p
            pkgconf:p
            protobuf:p
            python:p
            python-psutil:p
            python-glad:p
            python-jinja:p
            python-pip:p
            qt6-base:p
            qt6-declarative:p
            qt6-svg:p
            shaderc:p
            speexdsp:p
            spirv-cross:p
            vulkan:p
            vulkan-headers:p

      - name: Match the MinGW Protobuf generator and runtime
        run: |
          /mingw64/bin/protoc --version
          /mingw64/bin/python3 -m pip install --disable-pip-version-check --break-system-packages --only-binary=:all: 'protobuf==7.36.2'
          check_dir="$(mktemp -d)"
          trap 'rm -rf "$check_dir"' EXIT
          printf 'syntax = "proto3"; message Probe { string name = 1; }\n' > "$check_dir/rcp_proto_check.proto"
          /mingw64/bin/protoc -I "$check_dir" --python_out="$check_dir" "$check_dir/rcp_proto_check.proto"
          PYTHONPATH="$(cygpath -w "$check_dir")" /mingw64/bin/python3 -c 'import rcp_proto_check_pb2; assert rcp_proto_check_pb2.Probe(name="RCP").name == "RCP"'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Prepare MSYS2 media stack
        run: |
          SKIP_PACMAN=1 bash scripts/release/setup-msys2-build-env.sh
          rm -rf SDL3-* ffmpeg-n7.1-latest-win64-gpl-shared-7.1*

      - name: Verify client contracts
        shell: pwsh
        run: |
          ./scripts/nax5/verify-qml-product-mode.ps1
          ./scripts/nax5/verify-no-host-persistence.ps1
          ./scripts/nax5/verify-settings-contract.ps1
          ./scripts/nax5/verify-rcp-stream-tools.ps1

      - name: Build portable launcher and run unit tests
        env:
          ISCC: /c/Program Files (x86)/Inno Setup 6/ISCC.exe
        run: bash scripts/release/build-alpha05-user-pack.sh

      - name: Name fork build and generate checksum
        shell: pwsh
        run: |
          $output = 'artifacts/alpha-0.5'
          $archive = "$output/RCP-Windows-x64-portable.zip"
          Copy-Item "$output/NAX5-windows-portable.zip" $archive
          $checksum = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$output/SHA256SUMS.txt", "$checksum  RCP-Windows-x64-portable.zip`n", [Text.Encoding]::ASCII)
          "Portable ZIP (SHA-256): $checksum" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload RCP Windows x64 portable build
        uses: actions/upload-artifact@v4
        with:
          name: RCP-Windows-x64-portable
          path: |
            artifacts/alpha-0.5/RCP-Windows-x64-portable.zip
            artifacts/alpha-0.5/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  publish-preview:
    needs: build-release
    if: github.repository == 'ProhorovIlja/RCP' && github.ref == 'refs/heads/rcp-stream-quality' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: RCP-Windows-x64-portable
          path: dist

      - name: Verify checksum and publish a prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS.txt)
          version="${GITHUB_SHA:0:12}"
          tag="rcp-preview-$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/RCP-Windows-x64-portable.zip dist/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            flags=(
              --repo "$GITHUB_REPOSITORY"
              --target "$GITHUB_SHA"
              --prerelease
              --latest=false
              --title "RCP Preview $version — Windows x64"
              --notes "CI-built preview. Extract the ZIP and open NAX5/chiaki.exe. See RCP-QUICKSTART.md in the archive. Live NAX5 sign-in and playback are not verified by CI."
            )
            gh release create "$tag" dist/RCP-Windows-x64-portable.zip dist/SHA256SUMS.txt "${flags[@]}"
          fi
