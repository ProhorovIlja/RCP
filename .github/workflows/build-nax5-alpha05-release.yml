name: Build RCP Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - rcp-stream-quality

permissions:
  contents: read

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Disable autocrlf
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: git make unzip zip
          pacboy: >-
            cc:p
            cmake:p
            curl:p
            fast_float:p
            fftw:p
            hidapi:p
            json-c:p
            libevent:p
            lcms2:p
            libdovi:p
            meson:p
            miniupnpc:p
            gcc:p
            nasm:p
            ninja:p
            openssl:p
            opus:p
            pkgconf:p
            protobuf:p
            python:p
            python-psutil:p
            python-glad:p
            python-jinja:p
            python-pip:p
            qt6-base:p
            qt6-declarative:p
            qt6-svg:p
            shaderc:p
            speexdsp:p
            spirv-cross:p
            vulkan:p
            vulkan-headers:p

      - name: Install python protobuf
        run: pip install protobuf

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Prepare MSYS2 media stack
        run: |
          SKIP_PACMAN=1 bash scripts/release/setup-msys2-build-env.sh
          rm -rf SDL3-* ffmpeg-n7.1-latest-win64-gpl-shared-7.1*

      - name: Verify client contracts
        shell: pwsh
        run: |
          ./scripts/nax5/verify-qml-product-mode.ps1
          ./scripts/nax5/verify-no-host-persistence.ps1
          ./scripts/nax5/verify-settings-contract.ps1
          if (Test-Path ./scripts/nax5/verify-rcp-stream-tools.ps1) {
            ./scripts/nax5/verify-rcp-stream-tools.ps1
          }

      - name: Build portable launcher and run unit tests
        env:
          ISCC: /c/Program Files (x86)/Inno Setup 6/ISCC.exe
        run: bash scripts/release/build-alpha05-user-pack.sh

      - name: Name fork build and generate checksum
        shell: pwsh
        run: |
          $output = 'artifacts/alpha-0.5'
          $archive = "$output/RCP-Windows-x64-portable.zip"
          Copy-Item "$output/NAX5-windows-portable.zip" $archive
          $checksum = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  RCP-Windows-x64-portable.zip" | Set-Content "$output/SHA256SUMS.txt"
          "Portable ZIP (SHA-256): ``$checksum``" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload RCP Windows x64 portable build
        uses: actions/upload-artifact@v4
        with:
          name: RCP-Windows-x64-portable
          path: |
            artifacts/alpha-0.5/RCP-Windows-x64-portable.zip
            artifacts/alpha-0.5/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
